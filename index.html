<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Fabric.js TextFreeLine Example</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
    <script src="./TextFreeLine.js"></script>
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      body { font-family: Arial, sans-serif; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; background: #f5f7fa; color: #333; }
      h1 { margin: 24px 0 4px; font-size: 22px; }
      p.desc { margin: 0 0 4px; font-size: 14px; color: #666; }
      #canvas-wrapper { position: relative; display: inline-block; margin-top: 16px; }
      #canvas-wrapper canvas { display: block; border: 1px solid #ccc; }
      #overlay { position: absolute; top: 0; left: 0; pointer-events: none; overflow: visible; }
      .g-anchor { cursor: grab; pointer-events: all; } .g-anchor:active { cursor: grabbing; }
      .g-ctrl   { cursor: grab; pointer-events: all; } .g-ctrl:active   { cursor: grabbing; }
      .panel { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: 24px; max-width: 920px; padding: 20px; background: #fff; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 40px; }
      .form-group { display: flex; flex-direction: column; min-width: 150px; }
      .form-group label { margin-bottom: 6px; font-size: 14px; font-weight: 500; }
      .form-group input, .form-group select { padding: 6px 10px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; transition: border 0.2s; }
      .form-group input:focus, .form-group select:focus { border-color: #007bff; outline: none; }
      .btn-primary { padding: 10px 20px; font-size: 15px; font-weight: bold; background: #007bff; color: #fff; border: none; border-radius: 6px; cursor: pointer; transition: background 0.2s; margin-top: 10px; }
      .btn-primary:hover { background: #0056b3; }
      .btn-secondary { padding: 10px 20px; font-size: 15px; font-weight: bold; background: #f0f4ff; color: #0056b3; border: 1px solid #b0c4ff; border-radius: 6px; cursor: pointer; transition: background 0.2s; margin-top: 10px; }
      .btn-secondary:hover { background: #d8e6ff; } .btn-secondary.active { background: #dbeafe; border-color: #3b82f6; color: #1d4ed8; }
    </style>
  </head>
  <body>
    <h1>TextFreeLine</h1>
    <p class="desc">Text follows a fully customisable 7-point Bézier path. Double-click to edit inline.</p>
    <div id="canvas-wrapper">
      <canvas id="c" width="800" height="500"></canvas>
      <svg id="overlay" width="800" height="500"></svg>
    </div>
    <div class="panel">
      <div class="form-group"><label for="text-input">Text</label><input type="text" id="text-input" value="FREE LINE" /></div>
      <div class="form-group"><label for="fill-input">Fill Color</label><input type="color" id="fill-input" value="#005580" /></div>
      <div class="form-group"><label for="font-size-input">Font Size</label><input type="number" id="font-size-input" value="60" min="8" max="200" /></div>
      <div class="form-group"><label for="font-family-input">Font Family</label>
        <select id="font-family-input"><option value="Arial">Arial</option><option value="Verdana">Verdana</option><option value="Courier New">Courier New</option><option value="Georgia">Georgia</option></select></div>
      <div class="form-group"><label for="kerning-input">Kerning</label><input type="number" id="kerning-input" value="0" min="-20" max="100" /></div>
      <div class="form-group"><label for="flipped-input">Flipped</label><input type="checkbox" id="flipped-input" /></div>
      <div class="form-group"><label>&nbsp;</label><button class="btn-primary" id="update-btn">Update Text</button></div>
      <div class="form-group"><label>&nbsp;</label><button class="btn-secondary" id="toggle-pts-btn">Edit Control Points</button></div>
    </div>
    <script>
      const canvas = new fabric.Canvas('c');
      const overlayEl = document.getElementById('overlay');
      const obj = new fabric.TextFreeLine('FREE LINE', {
        left:400,top:300,originX:'center',originY:'center',
        fill:'#005580',fontSize:60,fontFamily:'Arial',kerning:0,flipped:false,
        editable:true,objectCaching:false,hasControls:true,
      });
      canvas.add(obj); canvas.setActiveObject(obj);

      document.getElementById('update-btn').addEventListener('click', function () {
        obj.set({ text:document.getElementById('text-input').value, fill:document.getElementById('fill-input').value, fontSize:parseInt(document.getElementById('font-size-input').value), fontFamily:document.getElementById('font-family-input').value, kerning:parseInt(document.getElementById('kerning-input').value), flipped:document.getElementById('flipped-input').checked });
        canvas.renderAll(); drawOverlay();
      });

      const NS='http://www.w3.org/2000/svg';
      const svgEl=(tag,a)=>{const el=document.createElementNS(NS,tag);if(a)for(const[k,v]of Object.entries(a))el.setAttribute(k,v);return el;};
      function localOrigin(){if(!obj._cw||!obj._H)return null;const W=obj._cw.reduce((s,w)=>s+w,0)+obj.kerning*Math.max(0,obj._chars.length-1);const c=obj.getCenterPoint();return{ox:c.x-(obj._bbX||0),oy:c.y-(obj._bbY||0),W,H:obj._H};}
      let overlayActive=false;
      function drawOverlay(){
        overlayEl.innerHTML='';if(!overlayActive||obj.isEditing)return;const lo=localOrigin();if(!lo)return;
        const{ox,oy,W,H}=lo,pts=obj.ctrlPts,ps=pts.map(p=>({x:ox+p.x*W,y:oy+p.y*H}));
        const d=`M${ps[0].x} ${ps[0].y} C${ps[1].x} ${ps[1].y} ${ps[2].x} ${ps[2].y} ${ps[3].x} ${ps[3].y} C${ps[4].x} ${ps[4].y} ${ps[5].x} ${ps[5].y} ${ps[6].x} ${ps[6].y}`;
        overlayEl.appendChild(svgEl('path',{d,fill:'none',stroke:'#4f96ff','stroke-width':'1.5',opacity:'.85'}));
        [[0,1],[3,2],[3,4],[6,5]].forEach(([a,b])=>overlayEl.appendChild(svgEl('line',{x1:ps[a].x,y1:ps[a].y,x2:ps[b].x,y2:ps[b].y,stroke:'#b06fff','stroke-width':'1',opacity:'.65'})));
        pts.forEach((pt,i)=>{const{x,y}=ps[i];const isA=i%3===0;const g=svgEl('g',{class:isA?'g-anchor':'g-ctrl'});
          if(isA){g.appendChild(svgEl('circle',{cx:x,cy:y,r:8,fill:'#4f96ff',stroke:'#fff','stroke-width':'2.5'}));}
          else{g.appendChild(svgEl('circle',{cx:x,cy:y,r:6,fill:'none',stroke:'#b06fff','stroke-width':'2'}));g.appendChild(svgEl('circle',{cx:x,cy:y,r:2.5,fill:'#b06fff'}));}
          makeDraggable(g,(dx,dy)=>{obj.set({ctrlPts:obj.ctrlPts.map((p,j)=>j===i?{x:p.x+dx/W,y:p.y+dy/H}:{x:p.x,y:p.y})});canvas.renderAll();drawOverlay();});
          overlayEl.appendChild(g);});
      }
      function makeDraggable(el,onDelta){el.addEventListener('mousedown',e=>{e.preventDefault();e.stopPropagation();let px=e.clientX,py=e.clientY;const move=e=>{onDelta(e.clientX-px,e.clientY-py);px=e.clientX;py=e.clientY;};const up=()=>{document.removeEventListener('mousemove',move);document.removeEventListener('mouseup',up);};document.addEventListener('mousemove',move);document.addEventListener('mouseup',up);});}
      canvas.on('object:moving',e=>{if(e.target===obj)drawOverlay();});canvas.on('object:modified',e=>{if(e.target===obj)drawOverlay();});
      obj.on('editing:entered',()=>{overlayEl.innerHTML='';});obj.on('editing:exited',()=>{if(overlayActive)obj.set({hasBorders:false,hasControls:false});drawOverlay();});
      document.getElementById('toggle-pts-btn').addEventListener('click',function(){overlayActive=!overlayActive;this.classList.toggle('active',overlayActive);this.textContent=overlayActive?'Hide Control Points':'Edit Control Points';obj.set({hasBorders:!overlayActive,hasControls:!overlayActive});canvas.requestRenderAll();if(overlayActive)drawOverlay();else overlayEl.innerHTML='';});
    </script>
  </body>
</html>
